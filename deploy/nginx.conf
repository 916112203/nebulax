# ============================================================
# SmartPipe GIS Nginx 配置（手动部署方案）
# 前端：/var/www/smartpipe（即项目 docs/ 构建产物）
# 后端：127.0.0.1:8080（Node 进程，systemd 守护）
# 安装：cp deploy/nginx.conf /etc/nginx/conf.d/smartpipe.conf
# ============================================================
server {
    listen 80;
    server_name _;   # 替换为域名或虚拟机 IP

    # 前端静态资源（hash 路由 SPA）
    root /var/www/smartpipe;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # REST API + WebSocket 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # WebSocket 升级
    location /api/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
